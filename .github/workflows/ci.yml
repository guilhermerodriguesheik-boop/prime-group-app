name: Prime Finance CI

on:
  push:
    branches: [main, prime-finance]
  pull_request:
    branches: [main]

concurrency:
  group: prime-finance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: AI economy tests
        run: npm run test:ai

      - name: Fiscal parser tests
        run: npm run test:fiscal

      - name: Ortobom parser tests
        run: npm run test:ortobom

      - name: Ortobom financial reconciliation parser tests
        run: npm run test:ortobom-finance

      - name: Selected cargo totals and WhatsApp draft tests
        run: node --experimental-strip-types --test tests/selected-freights.test.mjs

      - name: Manual balance settlement regression tests
        run: node --experimental-strip-types --test tests/manual-cargo-balance.test.mjs

      - name: Cargo payable calculations
        run: node --experimental-strip-types --test tests/cargo-costs.test.mjs

      - name: Simple cargo payment ledger tests
        run: node --experimental-strip-types --test tests/simple-cargo-ledger.test.mjs

      - name: Google OAuth and fiscal readiness tests
        run: npm run test:fiscal-readiness

      - name: DotCompany sandbox adapter contract tests
        run: npm run test:dotcompany

      - name: CT-e confirmation preflight tests
        run: npm run test:cte-consent

      - name: Production SEFAZ connection diagnostic tests
        run: npm run test:dotcompany-production

      - name: Official ANTT snapshot parser tests
        run: npm run test:antt-snapshot

      - name: Pluggy webhook registration health tests
        run: node --experimental-strip-types --test tests/pluggy-webhook-health.test.mjs

      - name: Pluggy webhook contract tests
        run: npm run test:pluggy

      - name: Build
        run: npm run build
